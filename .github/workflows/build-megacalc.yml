name: Build MegaCalc APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova & Create Project
        run: |
          npm install -g cordova
          cordova create app ir.matinmohammadi.megacalc "MegaCalc"
          cp index.html app/www/index.html
          cd app
          cordova platform add android
          cordova build android --debug

      - name: Upload MegaCalc APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegaCalc-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Automatic Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MegaCalc v1.0.${{ github.run_number }} (No e+ Edition)"
          files: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
