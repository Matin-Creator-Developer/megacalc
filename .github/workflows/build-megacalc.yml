name: Build Signed MegaCalc APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Signed Release APK with Custom Infinity Icon
        run: |
          mkdir -p android-app/app/src/main/java/ir/matinmohammadi/megacalc
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/mipmap-anydpi-v26
          cp index.html android-app/app/src/main/assets/index.html

          # ساخت کلید امضای دیجیتال رسمی برای پذیرش در کافه‌بازار و مایکت
          keytool -genkey -v -keystore android-app/app/release.keystore \
            -alias megacalc_key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Matin1383 -keypass Matin1383 \
            -dname "CN=Matin Mohammadi, OU=BodyMod, O=MatinTech, L=Urmia, S=WA, C=IR"

          # ساخت آیکون برداری نئونی با نماد بی‌نهایت (♾️) و کلیدهای ماشین‌حساب
          cat << 'ICON_BG' > android-app/app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#070A12" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#11192E" android:pathData="M18,18h72v72h-72z"/>
          </vector>
          ICON_BG

          cat << 'ICON_FG' > android-app/app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- کادر نمایشگر بالا -->
              <path
                  android:fillColor="#16223B"
                  android:strokeColor="#00F5D4"
                  android:strokeWidth="2.2"
                  android:pathData="M26,25h56v24h-56z"/>
              <!-- نماد بی‌نهایت (∞) درخشان وسط نمایشگر -->
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#00F5D4"
                  android:strokeWidth="3.8"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M43,31 C36,31 36,43 43,43 C48,43 51,37 54,37 C57,37 60,43 65,43 C72,43 72,31 65,31 C60,31 57,37 54,37 C51,37 48,31 43,31 Z"/>
              <!-- ۴ دکمه نئونی ماشین‌حساب در پایین -->
              <path android:fillColor="#9B5DE5" android:pathData="M26,55h25v12h-25z"/>
              <path android:fillColor="#1E293B" android:pathData="M57,55h25v12h-25z"/>
              <path android:fillColor="#1E293B" android:pathData="M26,71h25v12h-25z"/>
              <path android:fillColor="#F97316" android:pathData="M57,71h25v12h-25z"/>
          </vector>
          ICON_FG

          cat << 'ICON_ADAPTIVE' > android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          ICON_ADAPTIVE

          cat << 'GRADLE_ROOT' > android-app/settings.gradle
          rootProject.name = "MegaCalc"
          include ':app'
          GRADLE_ROOT

          cat << 'GRADLE_PROPS' > android-app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          GRADLE_PROPS

          cat << 'GRADLE_BUILD' > android-app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          GRADLE_BUILD

          cat << 'APP_BUILD' > android-app/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'ir.matinmohammadi.megacalc'
              compileSdkVersion 34

              defaultConfig {
                  applicationId "ir.matinmohammadi.megacalc"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 2
                  versionName "1.1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "Matin1383"
                      keyAlias "megacalc_key"
                      keyPassword "Matin1383"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          APP_BUILD

          cat << 'MANIFEST' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="MegaCalc"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat << 'JAVA_MAIN' > android-app/app/src/main/java/ir/matinmohammadi/megacalc/MainActivity.java
          package ir.matinmohammadi.megacalc;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#070a12"));
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url != null && (url.startsWith("http://") || url.startsWith("https://"))) {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                              return true;
                          }
                          return false;
                      }
                  });
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          JAVA_MAIN

          cd android-app
          gradle assembleRelease --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaCalc-Market-Signed-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Publish Automatic Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "MegaCalc v1.1.${{ github.run_number }} (Market Ready + Infinity Icon)"
          files: android-app/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
