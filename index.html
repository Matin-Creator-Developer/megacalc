<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MegaCalc | ماشین‌حساب نجومی و بی‌نهایت</title>
  <style>
    :root {
      --bg: #070a12;
      --screen-bg: #0f1626;
      --screen-border: rgba(0, 245, 212, 0.28);
      --btn-bg: #162035;
      --btn-active: #22304d;
      --btn-op: #231942;
      --neon-cyan: #00f5d4;
      --neon-purple: #9b5de5;
      --neon-orange: #f97316;
      --neon-gold: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
      --words-bg: rgba(155, 93, 229, 0.12);
      --words-border: rgba(155, 93, 229, 0.4);
      --modal-bg: #111827;
    }

    body.light-mode {
      --bg: #f1f5f9;
      --screen-bg: #ffffff;
      --screen-border: rgba(13, 148, 136, 0.35);
      --btn-bg: #ffffff;
      --btn-active: #e2e8f0;
      --btn-op: #f3e8ff;
      --neon-cyan: #0d9488;
      --neon-purple: #7e22ce;
      --neon-orange: #ea580c;
      --neon-gold: #d97706;
      --text: #0f172a;
      --muted: #64748b;
      --words-bg: rgba(126, 34, 206, 0.07);
      --words-border: rgba(126, 34, 206, 0.3);
      --modal-bg: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    body {
      margin: 0; padding: 12px;
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: background-color 0.25s, color 0.25s;
    }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 6px; padding: 2px 4px;
    }
    .brand-title {
      font-size: 13.5px; font-weight: 900; color: var(--neon-cyan);
      display: flex; align-items: center; gap: 4px;
    }
    .top-actions {
      display: flex; align-items: center; gap: 6px;
    }
    .top-btn {
      background: var(--screen-bg);
      border: 1.5px solid var(--screen-border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .top-btn.apps-btn {
      border-color: var(--neon-purple);
      color: var(--neon-purple);
    }

    .display-card {
      background: var(--screen-bg);
      border: 1.5px solid var(--screen-border);
      border-radius: 22px;
      padding: 14px 16px;
      flex: 1;
      margin: 8px 0 12px 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow-y: auto;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
    .expr-box {
      direction: ltr;
      text-align: right;
      font-size: 19px;
      color: var(--muted);
      word-break: break-all;
      line-height: 1.45;
      margin-bottom: 8px;
      min-height: 28px;
    }
    .result-raw-box {
      direction: ltr;
      text-align: right;
      font-size: 28px;
      font-weight: 900;
      color: var(--neon-cyan);
      word-break: break-all;
      line-height: 1.35;
      letter-spacing: 0.5px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(148,163,184,0.28);
    }
    .words-breakdown-box {
      margin-top: 10px;
      text-align: right;
      direction: rtl;
      font-size: 13.5px;
      line-height: 1.75;
      color: var(--text);
      background: var(--words-bg);
      border: 1px solid var(--words-border);
      border-radius: 14px;
      padding: 10px 12px;
      max-height: 38%;
      overflow-y: auto;
    }
    .unit-badge {
      display: inline-block;
      background: rgba(0, 245, 212, 0.12);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      border-radius: 8px;
      padding: 1px 7px;
      margin: 2px 3px;
      font-weight: 900;
      font-size: 12.5px;
    }
    .unit-badge.high-tier {
      background: rgba(251, 191, 36, 0.15);
      border-color: var(--neon-gold);
      color: var(--neon-gold);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding-bottom: 4px;
    }
    .key-btn {
      background: var(--btn-bg);
      border: 1px solid rgba(148,163,184,0.18);
      color: var(--text);
      border-radius: 18px;
      height: 61px;
      font-size: 23px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.08s, background 0.15s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .key-btn:active { transform: scale(0.93); background: var(--btn-active); }
    .key-op { background: var(--btn-op); color: var(--neon-purple); border-color: rgba(155,93,229,0.35); font-size: 25px; }
    .key-ac { background: rgba(239,68,68,0.15); color: #ef4444; border-color: rgba(239,68,68,0.35); font-size: 20px; }
    .key-del { background: rgba(249,115,22,0.15); color: var(--neon-orange); border-color: rgba(249,115,22,0.35); font-size: 20px; }
    .key-eq {
      background: linear-gradient(135deg, #f97316, #fbbf24);
      color: #070a12;
      font-size: 28px;
      font-weight: 900;
      border: none;
    }
    .key-zeros { font-size: 18px; color: var(--neon-gold); font-weight: 900; }

    /* پاپ‌آپ سایر برنامه‌ها */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center;
      padding: 18px; z-index: 999;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 2px solid var(--neon-purple);
      border-radius: 22px;
      padding: 20px 18px;
      width: 100%; max-width: 370px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.45);
    }
    .store-btn {
      width: 100%; padding: 13px; border-radius: 14px;
      font-size: 14px; font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 10px; border: none;
    }
    .btn-bazaar {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
    }
    .btn-myket {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand-title">
      <span>♾️ MegaCalc</span>
    </div>
    <div class="top-actions">
      <button class="top-btn apps-btn" onclick="openOtherAppsModal()">📱 سایر برنامه‌ها</button>
      <button class="top-btn" onclick="copyExactResult()">📋 کپی</button>
      <button class="top-btn" id="themeBtn" onclick="toggleTheme()" title="تغییر تم">☀️</button>
    </div>
  </div>

  <div class="display-card" id="displayCard">
    <div class="expr-box" id="exprBox">0</div>
    <div class="result-raw-box" id="resultRawBox">= 0</div>
    <div class="words-breakdown-box" id="wordsBox">
      💡 اعداد رو وارد کن رفیق! هر چقدر هم بزرگ بشه، بدون <b>e+</b> تمام رقم‌هاش رو می‌نویسم و از میلیارد به بالا برات معنی می‌کنم!
    </div>
  </div>

  <div class="keypad">
    <button class="key-btn key-ac" onclick="clearAll()">C</button>
    <button class="key-btn key-del" onclick="backspace()">⌫</button>
    <button class="key-btn key-zeros" onclick="appendDigits('000')">000</button>
    <button class="key-btn key-op" onclick="appendOp('÷')">÷</button>

    <button class="key-btn" onclick="appendDigits('7')">7</button>
    <button class="key-btn" onclick="appendDigits('8')">8</button>
    <button class="key-btn" onclick="appendDigits('9')">9</button>
    <button class="key-btn key-op" onclick="appendOp('×')">×</button>

    <button class="key-btn" onclick="appendDigits('4')">4</button>
    <button class="key-btn" onclick="appendDigits('5')">5</button>
    <button class="key-btn" onclick="appendDigits('6')">6</button>
    <button class="key-btn key-op" onclick="appendOp('-')">−</button>

    <button class="key-btn" onclick="appendDigits('1')">1</button>
    <button class="key-btn" onclick="appendDigits('2')">2</button>
    <button class="key-btn" onclick="appendDigits('3')">3</button>
    <button class="key-btn key-op" onclick="appendOp('+')">+</button>

    <button class="key-btn key-zeros" onclick="appendDigits('00')">00</button>
    <button class="key-btn" onclick="appendDigits('0')">0</button>
    <button class="key-btn" onclick="appendDot()">.</button>
    <button class="key-btn key-eq" onclick="lockResult()">=</button>
  </div>

  <!-- پاپ‌آپ سایر برنامه‌ها با انتخاب بازار یا مایکت -->
  <div class="modal-backdrop" id="otherAppsModal" onclick="if(event.target===this) closeOtherAppsModal()">
    <div class="modal-card">
      <div style="font-size: 34px; margin-bottom: 6px;">🚀</div>
      <div style="font-size: 16px; font-weight: 900; color: var(--neon-cyan); margin-bottom: 8px;">سایر برنامه‌های کاربردی ما</div>
      <p style="font-size: 13px; color: var(--muted); line-height: 1.65; margin: 0 0 14px 0;">
        سایر برنامه‌ها (مثل هوش مصنوعی تناسب اندام <b>BodyMod</b>) رو می‌خوای چطوری و از کدوم مارکت نصب کنی؟
      </p>
      <button class="store-btn btn-bazaar" onclick="openStore('bazaar')">
        🛒 مشاهده و نصب از کافه‌بازار
      </button>
      <button class="store-btn btn-myket" onclick="openStore('myket')">
        🟦 مشاهده و نصب از مایکت
      </button>
      <button onclick="closeOtherAppsModal()" style="margin-top: 14px; background: none; border: none; color: var(--muted); font-size: 12.5px; font-weight: 800; cursor: pointer;">
        بستن پنجره ✕
      </button>
    </div>
  </div>

  <script>
    let rawExpression = "";
    let lastCleanResult = "0";

    const SCALE_NAMES = [
      "",
      "هزار",
      "میلیون",
      "میلیارد",
      "تریلیون (هزار میلیارد / همت)",
      "کوادریلیون (میلیون میلیارد)",
      "کوینتیلیون (میلیارد میلیارد)",
      "سکستیلیون",
      "سپتیلیون",
      "اکتیلیون",
      "نونیلیون",
      "دسیلیون",
      "آندسیلیون",
      "دودسیلیون",
      "تریدسیلیون",
      "کواتوردسیلیون",
      "کویندسیلیون",
      "سکسدسیلیون",
      "سپتندسیلیون",
      "اکتودسیلیون",
      "نومدسیلیون",
      "ویجینتیلیون"
    ];

    // مدیریت تم تاریک و روشن
    function initTheme() {
      const saved = localStorage.getItem("megacalc_theme") || "dark";
      if (saved === "light") {
        document.body.classList.add("light-mode");
        document.getElementById("themeBtn").textContent = "🌙";
      } else {
        document.body.classList.remove("light-mode");
        document.getElementById("themeBtn").textContent = "☀️";
      }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle("light-mode");
      localStorage.setItem("megacalc_theme", isLight ? "light" : "dark");
      document.getElementById("themeBtn").textContent = isLight ? "🌙" : "☀️";
    }

    function openOtherAppsModal() {
      document.getElementById("otherAppsModal").style.display = "flex";
    }

    function closeOtherAppsModal() {
      document.getElementById("otherAppsModal").style.display = "none";
    }

    function openStore(store) {
      // لینک مستقیم به صفحه بادی‌مود در بازار و مایکت
      const pkg = "ir.matinmohammadi.bodymod";
      if (store === "bazaar") {
        window.location.href = "https://cafebazaar.ir/app/" + pkg;
      } else {
        window.location.href = "https://myket.ir/app/" + pkg;
      }
    }

    function addCommasToInteger(intStr) {
      let sign = "";
      if (intStr.startsWith("-")) {
        sign = "-";
        intStr = intStr.slice(1);
      }
      return sign + intStr.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function formatExpressionDisplay(expr) {
      if (!expr) return "0";
      return expr.replace(/\d+(\.\d+)?/g, (match) => {
        const parts = match.split(".");
        parts[0] = addCommasToInteger(parts[0]);
        return parts.join(".");
      });
    }

    function parseBigDecimal(str) {
      let sign = 1n;
      if (str.startsWith("-")) { sign = -1n; str = str.slice(1); }
      if (str.startsWith("+")) { str = str.slice(1); }
      const parts = str.split(".");
      const intPart = parts[0] || "0";
      const fracPart = parts[1] || "";
      const scale = BigInt(fracPart.length);
      const combined = (intPart + fracPart).replace(/^0+/, "") || "0";
      return { val: sign * BigInt(combined), scale: Number(scale) };
    }

    function formatBigDecimal(bd) {
      let isNeg = bd.val < 0n;
      let v = isNeg ? -bd.val : bd.val;
      let s = v.toString();
      if (bd.scale > 0) {
        if (s.length <= bd.scale) {
          s = "0." + "0".repeat(bd.scale - s.length) + s;
        } else {
          const cut = s.length - bd.scale;
          s = s.slice(0, cut) + "." + s.slice(cut);
        }
        s = s.replace(/\.?0+$/, "");
      }
      return (isNeg && s !== "0" ? "-" : "") + s;
    }

    function addBD(a, b) {
      const maxS = Math.max(a.scale, b.scale);
      const vA = a.val * (10n ** BigInt(maxS - a.scale));
      const vB = b.val * (10n ** BigInt(maxS - b.scale));
      return { val: vA + vB, scale: maxS };
    }

    function subBD(a, b) {
      return addBD(a, { val: -b.val, scale: b.scale });
    }

    function mulBD(a, b) {
      return { val: a.val * b.val, scale: a.scale + b.scale };
    }

    function divBD(a, b) {
      if (b.val === 0n) throw new Error("DIV_ZERO");
      const extraPrecision = 10;
      const scaleDiff = (b.scale - a.scale) + extraPrecision;
      let num = a.val;
      let den = b.val;
      let finalScale = extraPrecision;
      if (scaleDiff >= 0) {
        num = num * (10n ** BigInt(scaleDiff));
      } else {
        den = den * (10n ** BigInt(-scaleDiff));
      }
      return { val: num / den, scale: finalScale };
    }

    function evaluateExactExpression(expr) {
      let clean = expr.replace(/[×÷+\-.]+$/, "");
      if (!clean) return "0";

      const tokens = [];
      let i = 0;
      while (i < clean.length) {
        const ch = clean[i];
        if ((ch === "-" || ch === "+") && (i === 0 || "×÷+-".includes(clean[i - 1]))) {
          let numStr = ch;
          i++;
          while (i < clean.length && /[\d.]/.test(clean[i])) { numStr += clean[i]; i++; }
          tokens.push({ type: "num", bd: parseBigDecimal(numStr) });
        } else if (/[\d.]/.test(ch)) {
          let numStr = "";
          while (i < clean.length && /[\d.]/.test(clean[i])) { numStr += clean[i]; i++; }
          tokens.push({ type: "num", bd: parseBigDecimal(numStr) });
        } else if ("×÷+-".includes(ch)) {
          tokens.push({ type: "op", op: ch });
          i++;
        } else {
          i++;
        }
      }

      if (!tokens.length) return "0";

      let pass1 = [tokens[0]];
      for (let j = 1; j < tokens.length; j += 2) {
        const opObj = tokens[j];
        const nextNum = tokens[j + 1];
        if (!nextNum) break;
        const prev = pass1[pass1.length - 1];
        if (opObj.op === "×") {
          pass1[pass1.length - 1] = { type: "num", bd: mulBD(prev.bd, nextNum.bd) };
        } else if (opObj.op === "÷") {
          pass1[pass1.length - 1] = { type: "num", bd: divBD(prev.bd, nextNum.bd) };
        } else {
          pass1.push(opObj, nextNum);
        }
      }

      let acc = pass1[0].bd;
      for (let j = 1; j < pass1.length; j += 2) {
        const op = pass1[j].op;
        const nextBd = pass1[j + 1].bd;
        if (op === "+") acc = addBD(acc, nextBd);
        else if (op === "-") acc = subBD(acc, nextBd);
      }

      return formatBigDecimal(acc);
    }

    function buildScaleBreakdownHtml(numStr) {
      if (!numStr || numStr === "0") return "۰ (صفر)";
      let isNeg = false;
      if (numStr.startsWith("-")) { isNeg = true; numStr = numStr.slice(1); }

      const parts = numStr.split(".");
      const intStr = parts[0] || "0";
      const fracStr = parts[1] || "";

      const groups = [];
      for (let i = intStr.length; i > 0; i -= 3) {
        groups.push(intStr.slice(Math.max(0, i - 3), i));
      }

      const totalDigits = intStr.length;
      const badges = [];

      for (let idx = groups.length - 1; idx >= 0; idx--) {
        const val = parseInt(groups[idx], 10);
        if (val === 0) continue;
        const scaleName = SCALE_NAMES[idx] !== undefined ? SCALE_NAMES[idx] : `(۱۰ به توان ${idx * 3})`;
        const isBillionOrMore = idx >= 3;
        const badgeClass = isBillionOrMore ? "unit-badge high-tier" : "unit-badge";
        badges.push(`<span class="${badgeClass}">${val} ${scaleName}</span>`);
      }

      let headerInfo = `<div style="font-size:11.5px; color:var(--muted); margin-bottom:6px;">📏 تعداد ارقام صحیح: <b style="color:var(--neon-cyan);">${totalDigits} رقم</b> ${totalDigits >= 10 ? "🔥 (عبور از مرز میلیارد!)" : ""}</div>`;

      let bodyHtml = badges.length > 0 ? badges.join(" و ") : "۰";
      if (isNeg) bodyHtml = "منفی " + bodyHtml;
      if (fracStr) bodyHtml += ` <span class="unit-badge">ممیز ${fracStr}</span>`;

      return headerInfo + `<div>${bodyHtml}</div>`;
    }

    function updateScreen() {
      const exprEl = document.getElementById("exprBox");
      const rawEl = document.getElementById("resultRawBox");
      const wordsEl = document.getElementById("wordsBox");

      exprEl.textContent = formatExpressionDisplay(rawExpression);

      try {
        const exactStr = evaluateExactExpression(rawExpression);
        lastCleanResult = exactStr;
        const parts = exactStr.split(".");
        const formattedExact = addCommasToInteger(parts[0]) + (parts[1] ? "." + parts[1] : "");

        if (formattedExact.length > 36) rawEl.style.fontSize = "19px";
        else if (formattedExact.length > 20) rawEl.style.fontSize = "23px";
        else rawEl.style.fontSize = "28px";

        rawEl.textContent = "= " + formattedExact;
        wordsEl.innerHTML = buildScaleBreakdownHtml(exactStr);
      } catch (e) {
        if (e.message === "DIV_ZERO") {
          rawEl.textContent = "⛔ تقسیم بر صفر!";
          wordsEl.innerHTML = "رفیق هیچ عددی رو نمی‌شه بر صفر تقسیم کرد!";
        }
      }
    }

    function appendDigits(d) { rawExpression += d; updateScreen(); }
    function appendOp(op) {
      if (!rawExpression) {
        if (op === "-") { rawExpression = "-"; updateScreen(); }
        return;
      }
      if ("×÷+-".includes(rawExpression.slice(-1))) {
        rawExpression = rawExpression.slice(0, -1) + op;
      } else {
        rawExpression += op;
      }
      updateScreen();
    }
    function appendDot() {
      const parts = rawExpression.split(/[×÷+\-]/);
      const currentNum = parts[parts.length - 1] || "";
      if (!currentNum.includes(".")) {
        rawExpression += (currentNum === "" ? "0." : ".");
        updateScreen();
      }
    }
    function backspace() { rawExpression = rawExpression.slice(0, -1); updateScreen(); }
    function clearAll() { rawExpression = ""; lastCleanResult = "0"; updateScreen(); }
    function lockResult() {
      if (lastCleanResult && lastCleanResult !== "0") {
        rawExpression = lastCleanResult;
        updateScreen();
      }
    }
    function copyExactResult() {
      const parts = lastCleanResult.split(".");
      const formatted = addCommasToInteger(parts[0]) + (parts[1] ? "." + parts[1] : "");
      if (navigator.clipboard) {
        navigator.clipboard.writeText(formatted);
        alert("✅ عدد کامل کپی شد:\n" + formatted);
      }
    }

    initTheme();
  </script>
</body>
</html>
